<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7fb">
  <title>Task Manager</title>
  <!-- Embedded fallback for HTML-only previews. Keep in sync with style.css. -->
  <style>
:root {
  color-scheme: light;
  --ink: #252b3d;
  --muted: #6b7284;
  --accent: #6455d9;
  --border: #e8eaf2;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f6f7fb;
  color: var(--ink);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button, input, select { border-radius: 10px; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #a79bea;
  outline-offset: 3px;
}
.app { max-width: 880px; margin: 0 auto; padding: 72px 24px 32px; }
.page-header { margin-bottom: 32px; }
.eyebrow { color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: 2px; }
h1 { font-size: clamp(32px, 5vw, 44px); letter-spacing: -1.6px; margin: 12px 0; }
h1 span { color: var(--accent); }
.page-header p, footer { color: var(--muted); font-size: 15px; }
.card { background: white; border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 12px 40px #252b3d06; overflow: hidden; }
.task-form { display: flex; align-items: flex-end; gap: 12px; padding: 28px; }
.field { display: flex; flex-direction: column; gap: 9px; }
.task-field { flex: 1; min-width: 0; }
label { font-size: 12px; font-weight: 650; }
input[type="text"], select { min-height: 46px; padding: 11px 13px; border: 1px solid #dfe2ec; background: #fcfcfe; color: var(--ink); }
input::placeholder { color: #8a90a0; }
.primary-button { background: var(--accent); color: white; border: 0; padding: 13px 18px; min-height: 46px; font-weight: 600; white-space: nowrap; }
.primary-button:hover { background: #5142c3; }
.list-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 28px; border-block: 1px solid var(--border); }
.filters { display: flex; gap: 4px; }
.filters button { border: 0; background: transparent; padding: 8px 13px; color: var(--muted); font-size: 13px; font-weight: 600; }
.filters button[aria-pressed="true"] { background: #efedfc; color: var(--accent); }
.task-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
.task-list { list-style: none; padding: 0 28px; margin: 0; }
.task-item { display: flex; align-items: center; gap: 14px; padding: 20px 0; border-bottom: 1px solid var(--border); }
.task-item:last-child { border-bottom: 0; }
.task-checkbox { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.task-content { flex: 1; min-width: 0; }
.task-title { display: block; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
.completed .task-title { text-decoration: line-through; color: #8a90a0; }
.priority { display: inline-block; font-size: 10px; font-weight: 650; margin-top: 6px; padding: 3px 8px; border-radius: 5px; }
.priority-low { background: #eaf6ef; color: #28754f; }
.priority-medium { background: #fff4df; color: #946015; }
.priority-high { background: #feebed; color: #b13c4c; }
.task-actions { display: flex; gap: 4px; }
.text-button { border: 0; background: transparent; color: var(--muted); padding: 8px; font-size: 12px; }
.text-button:hover { background: #f3f2fb; color: var(--accent); }
.delete-button:hover { color: #b13c4c; background: #feebed; }
.empty-state { text-align: center; padding: 56px 20px; }
.empty-state[hidden] { display: none; }
.empty-icon { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: #f0eefc; color: var(--accent); font-size: 24px; }
.empty-state h2 { font-size: 17px; margin: 18px 0 8px; }
.empty-state p { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
.status-message { margin: 0; padding: 0 28px; font-size: 12px; color: #946015; }
.status-message:not(:empty) { padding-block: 14px; border-top: 1px solid var(--border); }
.edit-form { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.edit-form input { flex: 1; min-width: 140px; }
.edit-form select { max-width: 120px; }
.edit-form button { min-height: 40px; }
footer { text-align: center; margin-top: 26px; font-size: 12px; }
@media (max-width: 600px) {
  .app { padding: 36px 16px 24px; }
  .task-form { flex-wrap: wrap; padding: 20px; }
  .task-field { flex-basis: 100%; }
  .task-form > .field:not(.task-field) { flex: 1; }
  .list-toolbar { padding: 16px; flex-wrap: wrap; }
  .task-list { padding: 0 18px; }
  .task-item { gap: 10px; flex-wrap: wrap; }
  .task-actions { margin-left: auto; }
  .filters button { padding: 8px 10px; }
}
  </style>
  <link rel="stylesheet" href="./style.css?v=1">
  <script src="./script.js?v=1" defer></script>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <span class="eyebrow">A LITTLE FOCUS, EVERY DAY</span>
      <h1>Task Manager<span>.</span></h1>
      <p>Clear your mind. Make room for what matters.</p>
    </header>

    <section class="card" aria-label="Manage your tasks">
      <form id="task-form" class="task-form">
        <div class="field task-field">
          <label for="task-title">What needs to get done?</label>
          <input id="task-title" type="text" placeholder="Add a task…" maxlength="200" required autocomplete="off">
        </div>
        <div class="field">
          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <button type="submit" class="primary-button">+ Add task</button>
      </form>

      <div class="list-toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="active" aria-pressed="false">Active</button>
          <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <span id="task-count" class="task-count"></span>
      </div>
      <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
      <div id="empty-state" class="empty-state">
        <span class="empty-icon" aria-hidden="true">✓</span>
        <h2 id="empty-title">A fresh start</h2>
        <p id="empty-description">Add your first task and take it one step at a time.</p>
      </div>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </section>
    <footer>Small steps. Steady progress.</footer>
  </main>
</body>
</html>
